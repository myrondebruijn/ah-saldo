<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>AH Saldo</title>
  <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="AH Saldo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app" tabindex="-1"></main>
  <p id="toast" role="status"></p>
  <input id="importFile" type="file" accept=".json,application/json" hidden>

  <dialog id="cardDialog" aria-labelledby="cardTitle">
    <form method="dialog" novalidate>
      <h2 id="cardTitle"></h2>
      <label>Kaartnummer
        <input name="number" inputmode="numeric" autocomplete="off" placeholder="19 cijfers">
      </label>
      <label>Beveiligingscode
        <input name="code" inputmode="numeric" autocomplete="off" placeholder="6 cijfers">
      </label>
      <label>Saldo
        <input name="start" inputmode="decimal" autocomplete="off" placeholder="25,00">
      </label>
      <label>Geldig tot (optioneel)
        <input name="expiry" type="date">
      </label>
      <p class="error" role="alert"></p>
      <div class="row">
        <button type="button" data-action="close">Annuleren</button>
        <button class="primary" value="ok">Opslaan</button>
      </div>
    </form>
  </dialog>

  <dialog id="amountDialog" aria-labelledby="amountTitle">
    <form method="dialog" novalidate>
      <h2 id="amountTitle"></h2>
      <label><span id="amountLabel"></span>
        <input name="amount" inputmode="decimal" autocomplete="off" placeholder="12,50">
      </label>
      <p class="error" role="alert"></p>
      <div class="row">
        <button type="button" data-action="close">Annuleren</button>
        <button class="primary" value="ok">Opslaan</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog" aria-labelledby="confirmText">
    <form method="dialog">
      <p id="confirmText"></p>
      <div class="row">
        <button type="button" data-action="close">Annuleren</button>
        <button id="confirmOk" class="danger" value="ok"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
